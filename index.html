<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>𓃥 白六機械手訊息傳遞</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&family=Noto+Serif+TC:wght@900&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Noto Sans TC', sans-serif; touch-action: none; }
        canvas { display: block; }

        /* 控制面板 container */
        #panel-container {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            max-width: calc(100vw - 30px);
        }

        #toggle-btn {
            background: #111;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0,255,255,0.4);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        #toggle-btn:hover {
            background: #0ff;
            color: #000;
        }

        #panel {
            display: none; /* 預設收合 */
            background: rgba(10, 10, 10, 0.96);
            border: 2px solid rgba(0,255,255,0.8);
            padding: 16px;
            border-radius: 14px;
            width: 82vw;
            max-width: 340px;
            max-height: 75vh;
            overflow-y: auto;
            margin-top: 10px;
            color: #fff;
            box-shadow: 0 8px 30px rgba(0,0,0,0.95);
            box-sizing: border-box;
        }

        #panel::-webkit-scrollbar {
            width: 6px;
        }
        #panel::-webkit-scrollbar-thumb {
            background: #0ff;
            border-radius: 3px;
        }

        #panel label {
            display: block;
            margin-top: 10px;
            font-size: 15px;
            font-weight: bold;
            color: #0ff;
        }

        #panel label:first-child {
            margin-top: 0;
        }

        #panel textarea, #panel select, #panel input[type="color"], #share-url-input {
            width: 100%;
            margin-top: 6px;
            background: #222;
            color: #fff;
            border: 1.5px solid #555;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        #panel textarea {
            height: 80px;
            font-size: 15px;
            line-height: 1.4;
            resize: vertical;
        }

        #panel input[type="color"] {
            height: 42px;
            cursor: pointer;
            padding: 4px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn-group button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: transform 0.1s ease;
        }

        .btn-group button:active {
            transform: scale(0.96);
        }

        #apply-btn { background: #0088cc; color: white; }
        #share-btn { background: #28a745; color: white; }
        #record-btn { background: #dc3545; color: white; width: 100%; }
        #record-btn.recording { background: #ffc107; color: black; }

        /* 分享網址專區 */
        #share-section {
            margin-top: 12px;
            padding: 10px;
            background: rgba(0, 255, 255, 0.08);
            border: 1.5px dashed #0ff;
            border-radius: 10px;
        }

        #share-section label {
            margin-top: 0;
            color: #0ff;
            font-size: 13px;
        }

        #copy-action-btn {
            margin-top: 8px;
            width: 100%;
            padding: 10px;
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        #copy-status {
            display: none;
            color: #2ecc71;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div id="panel-container">
        <button id="toggle-btn" onclick="togglePanel(event)">𓃥 白六機械手訊息傳遞</button>
        <div id="panel">
            <label for="text-input">多行文字訊息 (每行輪播)</label>
            <textarea id="text-input">我是白六&#10;機械手臂排字&#10;自動滾動輸送帶</textarea>

            <label for="font-select">選擇中文字型</label>
            <select id="font-select">
                <option value="'Noto Sans TC', sans-serif">黑體 (Noto Sans)</option>
                <option value="'Noto Serif TC', serif">明體 (Noto Serif)</option>
                <option value="'Zhi Mang Xing', cursive">行書 (Zhi Mang Xing)</option>
            </select>

            <label for="color-picker">字體顏色</label>
            <input type="color" id="color-picker" value="#111111">

            <div class="btn-group">
                <button id="apply-btn" onclick="applySettings()">套用設定</button>
                <button id="share-btn" onclick="generateShareURL()">產生分享網址</button>
            </div>

            <div id="share-section">
                <label>分享 URL (點擊即全選)：</label>
                <input type="text" id="share-url-input" readonly onclick="this.select()">
                <button id="copy-action-btn" onclick="copyShareInput()">📋 一鍵複製網址</button>
                <div id="copy-status">✅ 已成功複製到剪貼簿！</div>
            </div>

            <div class="btn-group">
                <button id="record-btn" onclick="toggleRecording()">🎥 開始自動錄影</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let textLines = ["我是白六", "機械手臂排字", "自動滾動輸送帶"];
        let selectedFont = "'Noto Sans TC', sans-serif";
        let selectedColor = "#111111";

        let scene, camera, renderer, controls;
        let baseGroup, shoulderGroup, elbowGroup, gripperGroup, leftFinger, rightFinger;
        let leftTable, rightTable, beltTexture;
        
        let boxesOnBelt = [];
        let currentLineIndex = 0;
        let currentCharIndex = 0;
        let currentWord = textLines[0];

        let randomizedQueue = [];
        let state = 'INIT_LINE';
        let stateTimer = 0;
        let activeBox = null;
        
        let targetBeltX = 0;
        let targetSourcePos = new THREE.Vector3();
        let beltOffsetWorldX = 0;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        const boxSize = 0.5;
        const boxSpacing = 0.6;
        const upperArmLength = 2.2;
        const forearmLength = 1.8;

        const trayPosRight = new THREE.Vector3(2.20, -1.25, -3.15);
        const trayPosLeft = new THREE.Vector3(-2.20, -1.25, -3.15);

        let armPose = { base: 0, shoulder: 0, elbow: 0, wristYaw: 0, grip: 0.4 };
        let targetPose = { base: 0, shoulder: 0, elbow: 0, wristYaw: 0, grip: 0.4 };

        try {
            parseURLParams();
            init();
            setupClickOutsideToClose();
            animate();
        } catch (e) {
            console.error(e);
        }

        function togglePanel(e) {
            if (e) e.stopPropagation();
            const panel = document.getElementById('panel');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        }

        function setupClickOutsideToClose() {
            window.addEventListener('pointerdown', (e) => {
                const panelContainer = document.getElementById('panel-container');
                const panel = document.getElementById('panel');
                
                if (panel.style.display === 'block') {
                    if (!panelContainer.contains(e.target)) {
                        panel.style.display = 'none';
                    }
                }
            });
        }

        function parseURLParams() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('msg')) {
                try {
                    const msgText = decodeURIComponent(params.get('msg'));
                    textLines = msgText.split('\n').filter(l => l.trim() !== '');
                    document.getElementById('text-input').value = textLines.join('\n');

                    if (params.has('font')) {
                        selectedFont = decodeURIComponent(params.get('font'));
                        document.getElementById('font-select').value = selectedFont;
                    }
                    if (params.has('color')) {
                        selectedColor = decodeURIComponent(params.get('color'));
                        document.getElementById('color-picker').value = selectedColor;
                    }
                } catch(e) { console.error('URL 解析失敗', e); }
            }
        }

        function applySettings() {
            const rawText = document.getElementById('text-input').value;
            textLines = rawText.split('\n').filter(l => l.trim() !== '');
            if (textLines.length === 0) textLines = ["我是白六"];
            selectedFont = document.getElementById('font-select').value;
            selectedColor = document.getElementById('color-picker').value;

            currentLineIndex = 0;
            currentWord = textLines[0];
            clearBeltBoxes();
            state = 'INIT_LINE';
        }

        function generateShareURL() {
            const rawText = document.getElementById('text-input').value;
            const fontVal = document.getElementById('font-select').value;
            const colorVal = document.getElementById('color-picker').value;

            const url = new URL(window.location.href.split('?')[0]);
            url.searchParams.set('msg', encodeURIComponent(rawText));
            url.searchParams.set('font', encodeURIComponent(fontVal));
            url.searchParams.set('color', encodeURIComponent(colorVal));

            const shareableURL = url.toString();
            const urlInput = document.getElementById('share-url-input');
            const copyStatus = document.getElementById('copy-status');
            
            urlInput.value = shareableURL;
            copyStatus.style.display = 'none';

            copyShareInput();
        }

        function copyShareInput() {
            const urlInput = document.getElementById('share-url-input');
            const copyStatus = document.getElementById('copy-status');

            if (!urlInput.value) {
                generateShareURL();
                return;
            }

            urlInput.focus();
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(urlInput.value).then(() => {
                        copyStatus.style.display = 'block';
                    });
                } else {
                    document.execCommand('copy');
                    copyStatus.style.display = 'block';
                }
            } catch (err) {
                copyStatus.innerText = "❌ 請長按輸入框複製";
                copyStatus.style.display = 'block';
            }
        }

        function toggleRecording() {
            const btn = document.getElementById('record-btn');
            if (!isRecording) {
                applySettings();
                startRecording();
                btn.innerText = '⏹️ 錄影中 (完成自動下載)';
                btn.classList.add('recording');
            } else {
                stopRecording();
            }
        }

        function startRecording() {
            recordedChunks = [];
            const stream = renderer.domElement.captureStream(30);
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `white6_arm_animation_${Date.now()}.webm`;
                a.click();
                URL.revokeObjectURL(url);
                
                const btn = document.getElementById('record-btn');
                btn.innerText = '🎥 開始自動錄影';
                btn.classList.remove('recording');
                isRecording = false;
            };

            mediaRecorder.start();
            isRecording = true;
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
            }
        }

        function clearBeltBoxes() {
            for (let b of boxesOnBelt) scene.remove(b.mesh);
            boxesOnBelt = [];
            
            if (activeBox) { 
                scene.remove(activeBox); 
                if (gripperGroup) gripperGroup.remove(activeBox);
                activeBox = null; 
            }

            if (gripperGroup) {
                for (let i = gripperGroup.children.length - 1; i >= 0; i--) {
                    const child = gripperGroup.children[i];
                    if (child.type === "Mesh" && child !== leftFinger && child !== rightFinger && child.geometry.type === "BoxGeometry") {
                        gripperGroup.remove(child);
                    }
                }
            }

            beltOffsetWorldX = 0;
            if (beltTexture) beltTexture.offset.x = 0;
        }

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e1e);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 9);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);

            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            createEnvironment();
            createMechanicalArm();

            window.addEventListener('resize', onWindowResize);
        }

        function createBeltGrooveTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#222222';
            ctx.fillRect(0, 0, 512, 512);

            ctx.fillStyle = '#111111';
            const stripeWidth = 40;
            const gap = 24;

            for (let x = 0; x < 512; x += stripeWidth + gap) {
                ctx.fillRect(x, 0, stripeWidth, 512);
                ctx.fillStyle = '#333333';
                ctx.fillRect(x - 3, 0, 3, 512);
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(x + stripeWidth, 0, 4, 512);
                ctx.fillStyle = '#111111';
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 1);
            return texture;
        }

        function createCardboardTexture(char) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#c89d6e';
            ctx.fillRect(0, 0, 256, 256);

            ctx.fillStyle = 'rgba(0,0,0,0.04)';
            for (let i = 0; i < 300; i++) {
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            }

            if (char) {
                ctx.fillStyle = selectedColor;
                ctx.font = `900 180px ${selectedFont}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(char, 128, 134);
            }

            ctx.strokeStyle = '#a67c52';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, 246, 246);

            return new THREE.CanvasTexture(canvas);
        }

        function createEnvironment() {
            const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            grid.position.y = -1.5;
            scene.add(grid);

            beltTexture = createBeltGrooveTexture();
            const beltMat = new THREE.MeshStandardMaterial({ 
                map: beltTexture,
                roughness: 0.6,
                metalness: 0.2
            });
            const beltMesh = new THREE.Mesh(new THREE.BoxGeometry(12, 0.2, 1.2), beltMat);
            beltMesh.position.set(0, -1.4, 0);
            scene.add(beltMesh);

            const tableMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32 });
            
            leftTable = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 1.2), tableMat);
            leftTable.position.copy(trayPosLeft);
            scene.add(leftTable);

            rightTable = new THREE.Mesh(new THREE.BoxGeometry(2, 0.2, 1.2), tableMat);
            rightTable.position.copy(trayPosRight);
            scene.add(rightTable);
        }

        function createMechanicalArm() {
            const matBase = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
            const matArm = new THREE.MeshStandardMaterial({ color: 0xffaa00, metalness: 0.4, roughness: 0.3 });
            const matJoint = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9 });

            baseGroup = new THREE.Group();
            baseGroup.position.set(0, -1.3, -1.5);

            const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.8, 0.4, 32), matBase);
            baseGroup.add(baseMesh);

            shoulderGroup = new THREE.Group();
            shoulderGroup.position.y = 0.2;
            baseGroup.add(shoulderGroup);

            const shoulderMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.4, 32), matJoint);
            shoulderGroup.add(shoulderMesh);

            const upperArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, upperArmLength, 0.22), matArm);
            upperArm.position.y = upperArmLength / 2;
            shoulderGroup.add(upperArm);

            elbowGroup = new THREE.Group();
            elbowGroup.position.y = upperArmLength;
            shoulderGroup.add(elbowGroup);

            const elbowMesh = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), matJoint);
            elbowGroup.add(elbowMesh);

            const forearm = new THREE.Mesh(new THREE.BoxGeometry(0.18, forearmLength, 0.18), matArm);
            forearm.position.y = forearmLength / 2;
            elbowGroup.add(forearm);

            gripperGroup = new THREE.Group();
            gripperGroup.position.y = forearmLength;
            elbowGroup.add(gripperGroup);

            const gripBase = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.2), matJoint);
            gripperGroup.add(gripBase);

            leftFinger = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.25, 0.05), matBase);
            leftFinger.position.set(-0.25, -0.15, 0);
            gripperGroup.add(leftFinger);

            rightFinger = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.25, 0.05), matBase);
            rightFinger.position.set(0.25, -0.15, 0);
            gripperGroup.add(rightFinger);

            scene.add(baseGroup);
        }

        function createBoxMesh(char) {
            const texture = createCardboardTexture(char);
            const mats = Array(6).fill(new THREE.MeshStandardMaterial({ map: texture }));
            return new THREE.Mesh(new THREE.BoxGeometry(boxSize, boxSize, boxSize), mats);
        }

        function calculateVerticalIK(targetWorldPos, alignTargetYaw = 0) {
            const localTarget = targetWorldPos.clone().sub(baseGroup.position);
            let baseAngle = Math.atan2(localTarget.x, localTarget.z);
            
            let adjustedTargetY = localTarget.y - 0.15;
            let r = Math.sqrt(localTarget.x * localTarget.x + localTarget.z * localTarget.z);
            let h = adjustedTargetY;
            let d = Math.sqrt(r * r + h * h);

            let maxLen = upperArmLength + forearmLength;
            if (d > maxLen) d = maxLen - 0.01;

            let cosAngleElbow = (upperArmLength * upperArmLength + forearmLength * forearmLength - d * d) / (2 * upperArmLength * forearmLength);
            cosAngleElbow = Math.max(-1, Math.min(1, cosAngleElbow));
            let angleElbow = Math.PI - Math.acos(cosAngleElbow);

            let angleAlpha = Math.atan2(h, r);
            let cosAngleBeta = (upperArmLength * upperArmLength + d * d - forearmLength * forearmLength) / (2 * upperArmLength * d);
            cosAngleBeta = Math.max(-1, Math.min(1, cosAngleBeta));
            let angleBeta = Math.acos(cosAngleBeta);

            let angleShoulder = angleAlpha + angleBeta;

            let wristYawAngle = alignTargetYaw - baseAngle;

            return {
                base: baseAngle,
                shoulder: (Math.PI / 2) - angleShoulder,
                elbow: angleElbow,
                wristYaw: wristYawAngle
            };
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const dt = 0.016;

            if (state === 'INIT_LINE') {
                beltOffsetWorldX = 0;
                beltTexture.offset.x = 0;

                let charObjects = [];
                for (let i = 0; i < currentWord.length; i++) {
                    charObjects.push({ char: currentWord[i], originalIndex: i });
                }

                for (let i = charObjects.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [charObjects[i], charObjects[j]] = [charObjects[j], charObjects[i]];
                }

                randomizedQueue = [];
                for (let i = 0; i < charObjects.length; i++) {
                    const obj = charObjects[i];
                    const onLeft = Math.random() < 0.5;
                    const trayBase = onLeft ? trayPosLeft : trayPosRight;
                    const pos = new THREE.Vector3(
                        trayBase.x + (Math.random() * 1.4 - 0.7), 
                        -0.90, 
                        trayBase.z + (Math.random() * 0.6 - 0.3)
                    );
                    randomizedQueue.push({ char: obj.char, originalIndex: obj.originalIndex, pos: pos });
                }

                currentCharIndex = 0;
                state = 'SPAWN';
            }
            else if (state === 'SPAWN') {
                const task = randomizedQueue[currentCharIndex];
                activeBox = createBoxMesh(task.char);
                targetSourcePos.copy(task.pos);
                activeBox.position.copy(targetSourcePos);
                scene.add(activeBox);

                const totalWidth = currentWord.length * boxSpacing;
                const startBeltX = -totalWidth / 2 + boxSize / 2;
                targetBeltX = startBeltX + task.originalIndex * boxSpacing;

                state = 'HOVER';
            } 
            else if (state === 'HOVER') {
                stateTimer += dt;
                const hoverPos = targetSourcePos.clone().add(new THREE.Vector3(0, 1.0, 0));
                
                let ik = calculateVerticalIK(hoverPos, 0);
                targetPose.base = ik.base;
                targetPose.shoulder = ik.shoulder;
                targetPose.elbow = ik.elbow;
                targetPose.wristYaw = ik.wristYaw;
                targetPose.grip = 0.4;

                if (stateTimer > 0.6) {
                    stateTimer = 0;
                    state = 'DESCEND';
                }
            }
            else if (state === 'DESCEND') {
                stateTimer += dt;
                const descendPos = targetSourcePos.clone().add(new THREE.Vector3(0, boxSize / 2, 0));
                
                let ik = calculateVerticalIK(descendPos, 0);
                targetPose.base = ik.base;
                targetPose.shoulder = ik.shoulder;
                targetPose.elbow = ik.elbow;
                targetPose.wristYaw = ik.wristYaw;
                targetPose.grip = 0.4;

                if (stateTimer > 0.5) {
                    stateTimer = 0;
                    state = 'GRASP';
                }
            }
            else if (state === 'GRASP') {
                stateTimer += dt;
                targetPose.grip = 0.26;

                if (stateTimer > 0.3 && activeBox && activeBox.parent === scene) {
                    scene.remove(activeBox);
                    activeBox.position.set(0, -0.3, 0);
                    gripperGroup.add(activeBox);
                }

                if (stateTimer > 0.6) {
                    stateTimer = 0;
                    state = 'LIFT_AND_MOVE';
                }
            }
            else if (state === 'LIFT_AND_MOVE') {
                stateTimer += dt;

                const desiredTargetX = targetBeltX + beltOffsetWorldX;
                if (Math.abs(desiredTargetX) > 1.2) {
                    const shiftStep = (desiredTargetX > 0 ? -1.8 : 1.8) * dt;
                    beltOffsetWorldX += shiftStep;
                    beltTexture.offset.x += shiftStep * 0.2;
                    for (let item of boxesOnBelt) {
                        item.mesh.position.x += shiftStep;
                    }
                }

                // 【關鍵修正】：平移至輸送帶上方「兩個字盒高度」(Y = 0.0，約高於輸送帶表面 +1.0 單位)
                let highBeltTarget = new THREE.Vector3(targetBeltX + beltOffsetWorldX, 0.0, -1.0);
                let ik = calculateVerticalIK(highBeltTarget, 0);
                targetPose.base = ik.base;
                targetPose.shoulder = ik.shoulder;
                targetPose.elbow = ik.elbow;
                targetPose.wristYaw = ik.wristYaw;

                if (stateTimer > 0.9) {
                    stateTimer = 0;
                    state = 'DESCEND_TO_BELT';
                }
            }
            else if (state === 'DESCEND_TO_BELT') {
                stateTimer += dt;
                // 從高處下降至接近輸送帶表面放置點 (Y = -0.65)
                let dropTarget = new THREE.Vector3(targetBeltX + beltOffsetWorldX, -0.65, -1.0);
                let ik = calculateVerticalIK(dropTarget, 0);
                targetPose.base = ik.base;
                targetPose.shoulder = ik.shoulder;
                targetPose.elbow = ik.elbow;
                targetPose.wristYaw = ik.wristYaw;

                if (stateTimer > 0.5) {
                    stateTimer = 0;
                    state = 'RELEASE';
                }
            }
            else if (state === 'RELEASE') {
                stateTimer += dt;
                // 鬆開手指夾爪
                targetPose.grip = 0.4;

                // 字盒自然脫離夾爪落入輸送帶表面 (Y = -1.05)
                if (stateTimer > 0.2 && activeBox && activeBox.parent === gripperGroup) {
                    gripperGroup.remove(activeBox);
                    scene.add(activeBox);
                    
                    const placedX = targetBeltX + beltOffsetWorldX;
                    activeBox.position.set(placedX, -1.05, 0);
                    boxesOnBelt.push({ mesh: activeBox, relX: targetBeltX });
                    activeBox = null;
                }

                if (stateTimer > 0.5) {
                    targetPose.base = 0;
                    targetPose.shoulder = -0.2;
                    targetPose.elbow = 0.8;
                    targetPose.wristYaw = 0;

                    stateTimer = 0;
                    currentCharIndex++;

                    if (currentCharIndex >= randomizedQueue.length) {
                        state = 'HOLD';
                    } else {
                        state = 'SPAWN';
                    }
                }
            }
            else if (state === 'HOLD') {
                stateTimer += dt;
                if (stateTimer >= 1.0) {
                    stateTimer = 0;
                    state = 'CONVEYOR';

                    if (isRecording && currentLineIndex === textLines.length - 1) {
                        stopRecording();
                    }
                }
            }
            else if (state === 'CONVEYOR') {
                let allOut = true;
                const speed = 3.0 * dt;
                beltTexture.offset.x -= 0.5 * dt;

                for (let item of boxesOnBelt) {
                    item.mesh.position.x += speed;
                    if (item.mesh.position.x < 8.0) {
                        allOut = false;
                    }
                }

                if (allOut) {
                    for (let item of boxesOnBelt) {
                        scene.remove(item.mesh);
                    }
                    boxesOnBelt = [];

                    currentLineIndex = (currentLineIndex + 1) % textLines.length;
                    currentWord = textLines[currentLineIndex];
                    state = 'INIT_LINE';
                }
            }

            armPose.base = THREE.MathUtils.lerp(armPose.base, targetPose.base, 0.12);
            armPose.shoulder = THREE.MathUtils.lerp(armPose.shoulder, targetPose.shoulder, 0.12);
            armPose.elbow = THREE.MathUtils.lerp(armPose.elbow, targetPose.elbow, 0.12);
            armPose.wristYaw = THREE.MathUtils.lerp(armPose.wristYaw, targetPose.wristYaw, 0.12);
            armPose.grip = THREE.MathUtils.lerp(armPose.grip, targetPose.grip, 0.12);

            baseGroup.rotation.y = armPose.base;
            shoulderGroup.rotation.x = armPose.shoulder;
            elbowGroup.rotation.x = armPose.elbow;
            
            gripperGroup.rotation.x = - (armPose.shoulder + armPose.elbow) + 0.05;
            gripperGroup.rotation.y = armPose.wristYaw;

            leftFinger.position.x = -armPose.grip;
            rightFinger.position.x = armPose.grip;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
